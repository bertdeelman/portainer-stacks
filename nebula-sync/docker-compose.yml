# server1: synchroniseert Pi-hole media4 (primair) naar pihole-replica, elk uur
services:
  nebula-sync:
    image: ghcr.io/lovelaze/nebula-sync:${NEBULA_TAG}
    container_name: nebula-sync
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PRIMARY: ${NEBULA_PRIMARY}
      REPLICAS: ${NEBULA_REPLICAS}
      FULL_SYNC: "true"
      RUN_GRAVITY: "true"
      CRON: ${NEBULA_CRON}
    labels:
      - homepage.group=Services
      - homepage.name=Nebula Sync
      - homepage.icon=mdi-sync
      - homepage.description=Pi-hole sync media4 naar replica (server1)
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
        tag: "{{.Name}}"
