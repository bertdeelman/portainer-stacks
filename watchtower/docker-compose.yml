services:
  watchtower:
    image: nickfedor/watchtower:${WATCHTOWER_TAG}
    container_name: watchtower
    network_mode: ${DOCKER_NETWORK}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_STOPPED: "true"
      WATCHTOWER_REMOVE_VOLUMES: "false"
      WATCHTOWER_TIMEOUT: "30s"
      WATCHTOWER_SCHEDULE: ${WATCHTOWER_SCHEDULE}
      WATCHTOWER_MONITOR_ONLY: ${WATCHTOWER_MONITOR_ONLY}
      WATCHTOWER_NOTIFICATIONS_HOSTNAME: ${WATCHTOWER_HOSTNAME}
      WATCHTOWER_NOTIFICATION_REPORT: "true"
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_HTTP_API_TOKEN}
      WATCHTOWER_NOTIFICATION_TEMPLATE: |-
        {{- if .Report -}}{{- with .Report -}}
        Containers updated: {{len .Updated}}
        {{- range .Updated}}
        - {{.Name}}
        {{- end -}}
        {{- end -}}{{- else -}}
        Geen updates beschikbaar.
        {{- end -}}
      WATCHTOWER_NOTIFICATIONS: "shoutrrr"
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL}
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
        tag: "{{.Name}}"
