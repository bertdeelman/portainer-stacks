# server1: ESPHome Device Builder (vervangt de ESPHome-app op de t630)
# Host networking voor mDNS-ontdekking en OTA-uploads
services:
  esphome:
    image: ghcr.io/esphome/esphome:${ESPHOME_TAG}
    container_name: esphome
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${ESPHOME_CONFIG_DIR}:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${TZ}
      ESPHOME_DASHBOARD_USE_PING: "true"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
        tag: "{{.Name}}"
