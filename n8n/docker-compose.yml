# media4: stack "n8n" (gemigreerd van Portainer web editor)
services:
  n8n:
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    image: n8nio/n8n:${N8N_TAG}
    container_name: n8n
    restart: unless-stopped
    network_mode: ${DOCKER_NETWORK}
    user: "1000:1000"
    ports:
      - "${N8N_HOST_PORT}:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_POSTGRESDB_HOST}
      - DB_POSTGRESDB_PORT=${DB_POSTGRESDB_PORT}
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${DB_POSTGRESDB_USER}
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/db_postgresdb_password
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD_FILE=/run/secrets/n8n_basic_auth_password
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_PORT=${N8N_PORT}
      - N8N_METRICS=true
      - N8N_PROXY_HOPS=1
#      - N8N_TRUST_PROXY=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/projects
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_RUNNERS_MODE=internal
      - N8N_ENABLE_EXECUTE_COMMAND=true
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - NODES_EXCLUDE=[]
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ${DOCKER_DIR}/n8n/data:/home/node/.n8n
      - ${DOCKER_DIR}/n8n/files:/home/node/.n8n-files
      - ${PROJECTS_DIR}:/projects
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOWNLOADS_DIR}/complete/temp:/data/bron:ro
      - ${BOEKENSPOT_DIR}:/data/doel
      - ${BOEKENCALIBRE_DIR}:/data/calibre:ro
      - ${SECRETS_DIR}/db_postgresdb_password:/run/secrets/db_postgresdb_password:ro
      - ${SECRETS_DIR}/n8n_basic_auth_password:/run/secrets/n8n_basic_auth_password:ro
    group_add:
      - "65541"
    labels:
      - homepage.group=Automation
      - homepage.name=n8n
      - homepage.icon=n8n.png
      - homepage.href=http://${HOMEPAGE_HOST}:5678/
      - homepage.description=Workflows
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
        tag: '{{.Name}}'
