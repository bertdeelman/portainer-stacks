# media4: stack "grafana" (gemigreerd van Portainer web editor)
services:
  grafana:
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    container_name: grafana
    image: grafana/grafana:${GRAFANA_TAG}
    restart: unless-stopped
    user: root
    volumes:
      - ${DOCKER_DIR}/grafana:/var/lib/grafana
      - ${DOCKER_DIR}/grafana/grafana.ini:/etc/grafana/grafana.ini
      - ${DOCKER_DIR}/grafana/dashboards:/var/lib/grafana/dashboards
      - ${DOCKER_DIR}/grafana/plugins:/var/lib/grafana/plugins
      - ${DOCKER_DIR}/grafana/etc/provisioning/notifiers:/etc/grafana/provisioning/notifiers
    ports:
      - ${GRAFANA_HOST_PORT}:3000
    environment:
      - TZ=${TZ}
      - GF_ANALYTICS_REPORTING_ENABLED=FALSE
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - deellan
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"
        tag: "{{.Name}}"
    labels:
      - homepage.group=Monitoring
      - homepage.name=Grafana
      - homepage.icon=grafana.png
      - homepage.href=http://${HOMEPAGE_HOST}:3000/
      - homepage.description=Dashboards

networks:
  deellan:
    external: true
    name: ${DOCKER_NETWORK}
