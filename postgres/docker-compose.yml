# media4: stack "postgres" (gemigreerd van Portainer web editor)
services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    image: postgres:${POSTGRES_TAG}
    network_mode: ${DOCKER_NETWORK}
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=n8n
    volumes:
      - ${DOCKER_DIR}/postgres:/var/lib/postgresql/data
#
    labels:
      - homepage.group=Infrastructure
      - homepage.name=Postgres
      - homepage.icon=postgres.png
      - homepage.description=Gedeelde database
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
        tag: '{{.Name}}'
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_TAG}
    container_name: postgres-exporter
    network_mode: ${DOCKER_NETWORK}
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=${DATA_SOURCE_NAME}
      - TZ=${TZ}
    ports:
      - "${POSTGRES_EXPORTER_HOST_PORT}:9187"
    depends_on:
      - postgres
    labels:
      - homepage.group=Monitoring
      - homepage.name=Postgres exporter
      - homepage.icon=prometheus.png
      - homepage.description=Postgres-metrics
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: '3'
        tag: '{{.Name}}'
