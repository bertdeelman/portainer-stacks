# media4: Homepage dashboard, ontdekt services via Docker-labels op media4 en server1 (zie config/docker.yaml)
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_TAG}
    container_name: homepage
    network_mode: ${DOCKER_NETWORK}
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT}:3000"
    volumes:
      - ${HOMEPAGE_CONFIG_DIR}:/app/config
      - ${SECRETS_DIR}/portainer_key:/run/secrets/portainer_key:ro
      - ${SECRETS_DIR}/jellyfin_key:/run/secrets/jellyfin_key:ro
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
      HOMEPAGE_FILE_PORTAINER_KEY: /run/secrets/portainer_key
      HOMEPAGE_FILE_JELLYFIN_KEY: /run/secrets/jellyfin_key
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"
        tag: "{{.Name}}"
